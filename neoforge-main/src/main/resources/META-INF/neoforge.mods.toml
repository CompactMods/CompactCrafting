modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

${additional_access_transformers}
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[mods]] #mandatory
modId="compactcrafting"
version = "${mod_version}"
displayName="Compact Crafting"
authors="RobotGryphon and Zorn_Taov"
description='''
Compact Crafting adds a new crafting system, miniaturization crafting, to Minecraft.

Based off of the Compact Machines mod pre-1.16.
'''

[[dependencies.compactcrafting]] #optional
    modId="neoforge"
    mandatory=true
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.compactcrafting]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

